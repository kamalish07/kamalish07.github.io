<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Hyperlocal travel map with route markers">
  <rect width="600" height="440" fill="#FFF4E0"/>

  <!-- map blocks -->
  <g stroke="#12100E" stroke-width="4">
    <rect x="24" y="24" width="180" height="130" rx="12" fill="#46E39B"/>
    <rect x="220" y="24" width="150" height="90" rx="12" fill="#FFE9C7"/>
    <rect x="386" y="24" width="190" height="130" rx="12" fill="#C9A7FF"/>
    <rect x="24" y="170" width="130" height="150" rx="12" fill="#FFE9C7"/>
    <rect x="170" y="130" width="200" height="190" rx="12" fill="#FFD52E"/>
    <rect x="386" y="170" width="190" height="110" rx="12" fill="#FFE9C7"/>
    <rect x="24" y="336" width="250" height="80" rx="12" fill="#C9A7FF"/>
    <rect x="290" y="336" width="286" height="80" rx="12" fill="#46E39B"/>
    <rect x="386" y="296" width="190" height="24" rx="12" fill="#FFF4E0"/>
  </g>

  <!-- route -->
  <path d="M96 96 C210 150 190 240 268 250 C360 262 400 180 486 214 C540 236 520 320 430 376"
        fill="none" stroke="#FF4E2B" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 14"/>

  <!-- pins -->
  <g stroke="#12100E" stroke-width="4">
    <circle cx="96"  cy="96"  r="20" fill="#FF4E2B"/>
    <circle cx="268" cy="250" r="20" fill="#2F5FFF"/>
    <circle cx="486" cy="214" r="20" fill="#FFFFFF"/>
    <circle cx="430" cy="376" r="20" fill="#FF4E2B"/>
  </g>
  <g fill="#FFFFFF"><circle cx="96" cy="96" r="7"/><circle cx="430" cy="376" r="7"/></g>
  <circle cx="486" cy="214" r="7" fill="#12100E"/>
  <circle cx="268" cy="250" r="7" fill="#FFFFFF"/>

  <!-- callout -->
  <g>
    <rect x="300" y="140" width="160" height="46" rx="23" fill="#12100E"/>
    <text x="380" y="169" font-family="'Space Mono',monospace" font-size="14" font-weight="700" fill="#FFD52E" text-anchor="middle">NEAR YOU · 2 KM</text>
  </g>
</svg>
