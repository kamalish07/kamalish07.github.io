<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" role="img" aria-label="Illustrated portrait placeholder">
  <defs>
    <clipPath id="pc"><rect width="520" height="560"/></clipPath>
  </defs>
  <g clip-path="url(#pc)">
    <rect width="520" height="560" fill="#FFE9C7"/>

    <!-- backdrop shapes -->
    <circle cx="130" cy="120" r="88" fill="#FFD52E" stroke="#12100E" stroke-width="4"/>
    <path d="M400 40 L500 40 L500 150 Z" fill="#2F5FFF" stroke="#12100E" stroke-width="4"/>
    <rect x="30" y="330" width="70" height="70" rx="10" fill="#FF7BAC" stroke="#12100E" stroke-width="4" transform="rotate(-12 65 365)"/>

    <!-- shoulders -->
    <path d="M110 560 C120 450 175 405 260 405 C345 405 400 450 410 560 Z" fill="#FF4E2B" stroke="#12100E" stroke-width="5"/>
    <path d="M232 400 h56 v46 h-56 z" fill="#E8DCC8" stroke="#12100E" stroke-width="5"/>

    <!-- head -->
    <rect x="168" y="168" width="184" height="222" rx="76" fill="#F6E3C8" stroke="#12100E" stroke-width="5"/>
    <!-- hair -->
    <path d="M162 262 C158 178 208 140 260 140 C312 140 362 178 358 262 C348 238 344 214 322 206 C288 224 232 224 198 206 C176 214 172 238 162 262 Z" fill="#12100E"/>
    <!-- eyes -->
    <circle cx="222" cy="278" r="11" fill="#12100E"/>
    <circle cx="298" cy="278" r="11" fill="#12100E"/>
    <path d="M204 254 q18 -12 36 -2" stroke="#12100E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M280 252 q18 -10 36 2" stroke="#12100E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M224 330 q36 30 72 0" stroke="#12100E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="198" cy="312" rx="15" ry="9" fill="#FF7BAC" opacity=".75"/>
    <ellipse cx="322" cy="312" rx="15" ry="9" fill="#FF7BAC" opacity=".75"/>

    <!-- badge on chest -->
    <rect x="292" y="470" width="94" height="34" rx="17" fill="#FFD52E" stroke="#12100E" stroke-width="4"/>
    <text x="339" y="493" font-family="'Space Mono',monospace" font-size="14" font-weight="700" fill="#12100E" text-anchor="middle">PM</text>
  </g>
  <rect x="2" y="2" width="516" height="556" fill="none" stroke="#12100E" stroke-width="4"/>
</svg>
