<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Meesho Valmo RTO Optimization Case Study">
  <rect width="600" height="440" fill="#58103A"/>
  <g opacity=".25" stroke="#FFF4E0" stroke-width="2.5">
    <path d="M0 110 H600 M0 220 H600 M0 330 H600 M150 0 V440 M300 0 V440 M450 0 V440"/>
  </g>

  <!-- Title Pill -->
  <rect x="36" y="34" width="180" height="40" rx="20" fill="#FFF4E0" stroke="#12100E" stroke-width="4"/>
  <text x="126" y="60" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#12100E" text-anchor="middle">MEESHO × VALMO</text>

  <!-- Metric Badge -->
  <rect x="380" y="34" width="184" height="40" rx="20" fill="#FFD52E" stroke="#12100E" stroke-width="4"/>
  <text x="472" y="60" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#12100E" text-anchor="middle">₹2,567 Cr RTO POOL</text>

  <!-- Left: Parcel & Funnel Flow -->
  <g stroke="#12100E" stroke-width="5">
    <!-- Box Body -->
    <rect x="64" y="120" width="220" height="190" rx="16" fill="#FFF4E0"/>
    <!-- Tape / Ribbon -->
    <rect x="156" y="120" width="36" height="190" fill="#FF8A00"/>
    <rect x="64" y="200" width="220" height="30" fill="#FF8A00"/>
    <!-- Valmo label on box -->
    <rect x="88" y="145" width="86" height="38" rx="8" fill="#58103A"/>
  </g>
  <text x="131" y="169" font-family="Arial Black, Arial, sans-serif" font-size="14" fill="#FFF4E0" text-anchor="middle">VALMO</text>

  <!-- Delivered badge on Box -->
  <g transform="rotate(-8 174 270)">
    <rect x="94" y="248" width="160" height="44" rx="22" fill="#46E39B" stroke="#12100E" stroke-width="4"/>
    <text x="174" y="276" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#12100E" text-anchor="middle">RECOVERED ✓</text>
  </g>

  <!-- Savings Banner below box -->
  <rect x="64" y="335" width="220" height="52" rx="14" fill="#2F5FFF" stroke="#12100E" stroke-width="4"/>
  <text x="174" y="357" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFF4E0" text-anchor="middle">EACH 1% RTO CUT</text>
  <text x="174" y="375" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFD52E" text-anchor="middle">SAVES ~₹160 Cr / YR</text>

  <!-- Right: Recovery Ladder Card -->
  <g stroke="#12100E" stroke-width="5">
    <rect x="320" y="104" width="230" height="286" rx="20" fill="#FFF4E0"/>
  </g>
  <!-- Card Header -->
  <rect x="340" y="124" width="190" height="34" rx="8" fill="#12100E"/>
  <text x="435" y="146" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFF4E0" text-anchor="middle">RECOVERY LADDER</text>

  <!-- Step 1 -->
  <g stroke="#12100E" stroke-width="3">
    <rect x="340" y="172" width="190" height="42" rx="8" fill="#FFD52E"/>
  </g>
  <text x="352" y="192" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#12100E">1. At Doorstep</text>
  <text x="352" y="206" font-family="'Space Mono', monospace" font-size="10" fill="#12100E">UPI QR / Landmark / OTP</text>

  <!-- Step 2 -->
  <g stroke="#12100E" stroke-width="3">
    <rect x="340" y="226" width="190" height="42" rx="8" fill="#FF7BAC"/>
  </g>
  <text x="352" y="246" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#12100E">2. Reason-Led Recovery</text>
  <text x="352" y="260" font-family="'Space Mono', monospace" font-size="10" fill="#12100E">Time window / Hold at hub</text>

  <!-- Step 3 -->
  <g stroke="#12100E" stroke-width="3">
    <rect x="340" y="280" width="190" height="42" rx="8" fill="#46E39B"/>
  </g>
  <text x="352" y="300" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#12100E">3. 30-Day A/B Pilot</text>
  <text x="352" y="314" font-family="'Space Mono', monospace" font-size="10" fill="#12100E">2 treatment hubs + control</text>

  <!-- Pilot Badge -->
  <rect x="340" y="336" width="190" height="38" rx="10" fill="#FF4E2B" stroke="#12100E" stroke-width="3.5"/>
  <text x="435" y="360" font-family="Arial Black, Arial, sans-serif" font-size="12" fill="#FFF4E0" text-anchor="middle">DICE CHALLENGE S3</text>
</svg>
