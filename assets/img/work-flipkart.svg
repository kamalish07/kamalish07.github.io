<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Creator-led Gen Z commerce collage">
  <rect width="600" height="440" fill="#2F5FFF"/>
  <g opacity=".28" stroke="#FFF4E0" stroke-width="3">
    <path d="M0 110 H600 M0 220 H600 M0 330 H600 M150 0 V440 M300 0 V440 M450 0 V440"/>
  </g>

  <!-- phone -->
  <rect x="196" y="42" width="208" height="356" rx="30" fill="#FFF4E0" stroke="#12100E" stroke-width="6"/>
  <rect x="266" y="56" width="68" height="14" rx="7" fill="#12100E"/>

  <!-- feed items -->
  <g stroke="#12100E" stroke-width="4">
    <rect x="216" y="88" width="168" height="112" rx="12" fill="#FF7BAC"/>
    <rect x="216" y="212" width="168" height="16" rx="8" fill="#12100E"/>
    <rect x="216" y="238" width="120" height="16" rx="8" fill="#C9A7FF"/>
    <rect x="216" y="272" width="168" height="86" rx="12" fill="#FFD52E"/>
  </g>

  <!-- play button -->
  <circle cx="300" cy="144" r="30" fill="#FFF4E0" stroke="#12100E" stroke-width="5"/>
  <path d="M291 130 L317 144 L291 158 Z" fill="#12100E"/>

  <!-- floating creator cards -->
  <g stroke="#12100E" stroke-width="5">
    <rect x="34" y="96" width="132" height="96" rx="14" fill="#46E39B" transform="rotate(-8 100 144)"/>
    <rect x="430" y="150" width="140" height="100" rx="14" fill="#FFD52E" transform="rotate(7 500 200)"/>
    <rect x="52" y="276" width="118" height="88" rx="14" fill="#C9A7FF" transform="rotate(6 111 320)"/>
  </g>
  <g font-family="'Space Mono',monospace" font-size="13" font-weight="700" fill="#12100E">
    <text x="100" y="150" text-anchor="middle" transform="rotate(-8 100 150)">CREATOR</text>
    <text x="500" y="206" text-anchor="middle" transform="rotate(7 500 206)">DROP</text>
    <text x="111" y="326" text-anchor="middle" transform="rotate(6 111 326)">HAUL</text>
  </g>

  <!-- price tag -->
  <g transform="rotate(-6 420 360)">
    <rect x="352" y="338" width="136" height="44" rx="22" fill="#FF4E2B" stroke="#12100E" stroke-width="5"/>
    <text x="420" y="367" font-family="'Space Mono',monospace" font-size="15" font-weight="700" fill="#FFF4E0" text-anchor="middle">GEN Z</text>
  </g>
</svg>
